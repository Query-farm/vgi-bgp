#
# Build and publish the multi-arch vgi-bgp image to ghcr.io. The heavy lifting
# (multi-arch build -> per-arch /health boot smoke -> image SQL suite -> push ->
# manifest -> cosign-sign) lives in the shared reusable workflow
# Query-farm/vgi-actions; this file gates on the repo's own test suite and
# supplies the worker-specific inputs.
#
# Tag-driven: vX.Y.Z -> :X.Y.Z/:X.Y/:latest, push to release tags only (no :edge image on pushes to main). Publishing a
# GitHub Release creates the tag, which fires this too.
name: Publish image to ghcr.io

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate every image on the full unit + vgi-extension integration suite, so a
  # broken worker is never imaged.
  #
  # A called reusable workflow may not request MORE permission than its caller
  # job grants. ci.yml's `audit` job needs `checks: write` (rustsec/audit-check
  # posts a check-run), so this caller job must grant it too — otherwise the
  # read-only default caps the nested request and the whole run fails to start
  # (startup_failure). `contents: read` covers the checkout in ci.yml's jobs.
  ci-status:
    # A release tag usually points at a commit whose push to main already passed CI.
    # Reuse that result instead of running the whole CI matrix again; otherwise run CI below.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq .total_count || echo 0)
          echo "ci.yml successes for ${GITHUB_SHA}: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: [ci-status]
    if: ${{ needs.ci-status.outputs.passed != 'true' }}
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-bgp
      # Rust binary — nothing to `import`, so the language-import smoke is skipped.
      # The reusable workflow still runs its dual-arch HTTP /health boot smoke.
      smoke_import: ""
      health_port: "8000"
      version_check_cmd: "ci/check-version.sh"
      # Validate the built image's transports against the signed vgi extension.
      # The worker *logic* is already exercised every run by the gating `ci` job
      # (all test/sql/*, stdio/launch/http, via ci/run-integration.sh), so here we
      # only prove the IMAGE's entrypoints speak the protocol end to end, through
      # the same script with a preset LOCATION:
      #   - stdio: the file-free scalars suite through `docker run … stdio`;
      #   - HTTP : the FULL test/sql suite against a SINGLE warm container via the
      #            default `http` entrypoint + /health.
      # The .test files decode `data/*.mrt` fixtures, which the worker reads from
      # ITS filesystem, so the HTTP container bind-mounts `data/` read-only at
      # /app/data (the worker's WORKDIR). scan_state.test needs one row per batch,
      # so the container gets `-e VGI_BGP_BATCH_ROWS=1`.
      # $CITEST_IMAGE is the loaded <image>:citest-amd64 ref.
      image_test: |
        echo "::group::install haybarn-unittest (pinned: Makefile HAYBARN_VERSION, as ci.yml)"
        HAYBARN_VERSION="$(sed -n 's/^HAYBARN_VERSION *?= *//p' Makefile)"
        test -n "$HAYBARN_VERSION" || { echo "HAYBARN_VERSION not found in Makefile" >&2; exit 1; }
        if ! command -v uv >/dev/null; then
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
        fi
        uv venv -q --allow-existing .tools
        uv pip install -q -p .tools "haybarn-unittest==$HAYBARN_VERSION"
        export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
        echo "::endgroup::"

        echo "::group::stdio entrypoint smoke (scalars.test, file-free)"
        TRANSPORT=stdio \
          TEST_PATTERN="test/sql/scalars.test" \
          VGI_BGP_WORKER="docker run -i --rm -e VGI_BGP_BATCH_ROWS=1 $CITEST_IMAGE stdio" \
          ci/run-integration.sh
        echo "::endgroup::"

        echo "::group::full SQL suite — HTTP transport (one warm container)"
        CID=$(docker run -d -p 18000:8000 -e VGI_BGP_BATCH_ROWS=1 -v "$PWD/data:/app/data:ro" "$CITEST_IMAGE")
        trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:18000/health && break; sleep 1; done
        TRANSPORT=http VGI_BGP_WORKER="http://localhost:18000" ci/run-integration.sh
        echo "::endgroup::"
